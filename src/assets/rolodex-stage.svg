<svg xmlns="http://www.w3.org/2000/svg" width="400" height="749.8" viewBox="0 0 400 749.8" fill="none">
  <title>摘录回顾 · 名片架与卡片</title>
  <!--
    完整的静态场景：架子 + 上槽（已翻过）+ 下槽（还没轮到）+ 翻页片。

    与应用里的层序一致，只是翻页片停在 rest（没在翻）的姿态上：
      0  架子后半  —— 探出上槽的纸边、两侧滚轮、下槽底部的蓝色垫块
      1  上槽卡    —— 上一张，压暗 5%
      1  下槽卡    —— 下一张，比翻页片低 9px（progress=0 时的 lowerY），只在底下探出一条纸边
      3  翻页片    —— 当前这张，盖住下槽卡
      4  架子前半  —— 两条腿、外弯的脚、底部横杆、铰链上的两个卡夹

    卡片 296.8x330、圆角 12，坐标和配色同 src/app/review/rolodex/tokens.ts，
    正文/落款的排版参数同 ExcerptCard.tsx（正文 21px/行高 34.02，落款 11px/行高 13.75）。
    断行是按应用里真实渲染量出来手动写死的 —— SVG 的 <text> 不换行。
  -->
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#12141a" flood-opacity="0.16"/>
    </filter>
    <!-- 和应用同一套字体。两个 src 并存：走 dev server 时命中 /fonts/，直接用
         Finder 打开（file://）时命中相对路径。都取不到就退到系统宋体 / 苹方。 -->
    <style>
      @font-face {
        font-family: "HuiWenMingChao";
        src: url("/fonts/HuiWenMingChao.woff2") format("woff2"),
             url("../../public/fonts/HuiWenMingChao.woff2") format("woff2");
      }
      @font-face {
        font-family: "FZLanTingXiHei";
        src: url("/fonts/FZLanTingXiHei.woff2") format("woff2"),
             url("../../public/fonts/FZLanTingXiHei.woff2") format("woff2");
      }
    </style>
  </defs>

  <!-- ── 架子后半 ───────────────────────────────────────────── -->
  <g id="rack-back">
  <!-- back：探出上槽的纸边，暗示后面还压着一沓 -->
  <rect x="63.1" y="27.7" width="273.8" height="46" rx="7" fill="#e9e7e1" opacity="0.92"/>
  <rect x="67.5" y="18.7" width="265.1" height="46" rx="7" fill="#e9e7e1" opacity="0.68"/>
  <rect x="71.9" y="9.7" width="256.4" height="46" rx="7" fill="#e9e7e1" opacity="0.44"/>

  <!-- back：两侧滚轮 -->
  <g>
    <rect x="24.45" y="342.45" width="31.7" height="58.5" rx="9" fill="#15171c"/>
    <rect x="30.45" y="355.25" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="30.45" y="365" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="30.45" y="374.75" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="30.45" y="384.5" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="31.45" y="347.75" width="17.7" height="3.8" rx="1.9" fill="#ffffff" opacity="0.1"/>
  </g>
  <g>
    <rect x="343.85" y="342.45" width="31.7" height="58.5" rx="9" fill="#15171c"/>
    <rect x="349.85" y="355.25" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="349.85" y="365" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="349.85" y="374.75" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="349.85" y="384.5" width="19.7" height="3" rx="1.5" fill="#0a0b0e" opacity="0.7"/>
    <rect x="350.85" y="347.75" width="17.7" height="3.8" rx="1.9" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- back：下槽底边露出来的蓝色垫块 -->
  <rect x="119.9" y="698.7" width="160.2" height="17" rx="8" fill="#6f9dd0" opacity="0.45"/>
  </g>

  <!-- ── 上槽：已经翻过去的那张 ───────────────────────────────── -->
  <g id="card-upper">
    <rect x="51.6" y="41.7" width="296.8" height="330" rx="12" fill="#fdfcf9" filter="url(#cardShadow)"/>
    <circle cx="330.9" cy="59.2" r="4.5" fill="#20232a" opacity="0.1"/>
    <g font-family="HuiWenMingChao, Songti SC, Noto Serif SC, serif" font-size="21" fill="#20232a" letter-spacing="0.3">
      <text x="73.6" y="86.7">我来，不为写诗，不为预</text>
      <text x="73.6" y="120.72">言，不为作画。人只有一</text>
      <text x="73.6" y="154.74">个使命：走向自我。</text>
    </g>
    <g font-family="FZLanTingXiHei, PingFang SC, sans-serif" font-size="11" fill="#7d838d">
      <text x="73.6" y="321.51">德米安</text>
      <text x="73.6" y="338.26">黑塞</text>
      <text x="73.6" y="355.01">2026/10/01</text>
    </g>
    <rect x="51.6" y="41.7" width="296.8" height="330" rx="12" fill="#0c0e14" opacity="0.05"/>
  </g>

  <!-- ── 下槽：还没轮到的那张，只在底下探出 9px 纸边 ───────────── -->
  <g id="card-lower">
    <rect x="51.6" y="380.7" width="296.8" height="330" rx="12" fill="#fdfcf9" filter="url(#cardShadow)"/>
    <rect x="63.6" y="381.7" width="272.8" height="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="330.9" cy="398.2" r="4.5" fill="#20232a" opacity="0.1"/>
    <g font-family="HuiWenMingChao, Songti SC, Noto Serif SC, serif" font-size="21" fill="#20232a" letter-spacing="0.3">
      <text x="73.6" y="425.7">人根本无须害怕任何人。</text>
      <text x="73.6" y="459.72">如果一个人害怕某人，就</text>
      <text x="73.6" y="493.74">会将此人的权力置于自身</text>
      <text x="73.6" y="527.76">之上。</text>
    </g>
    <g font-family="FZLanTingXiHei, PingFang SC, sans-serif" font-size="11" fill="#7d838d">
      <text x="73.6" y="660.51">德米安</text>
      <text x="73.6" y="677.26">黑塞</text>
      <text x="73.6" y="694.01">2026/10/01</text>
    </g>
  </g>

  <!-- ── 翻页片：当前这张，停在 rest 姿态 ─────────────────────── -->
  <g id="card-flap">
    <rect x="51.6" y="371.7" width="296.8" height="330" rx="12" fill="#fdfcf9" filter="url(#cardShadow)"/>
    <rect x="63.6" y="372.7" width="272.8" height="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="330.9" cy="389.2" r="4.5" fill="#20232a" opacity="0.1"/>
    <g font-family="HuiWenMingChao, Songti SC, Noto Serif SC, serif" font-size="21" fill="#20232a" letter-spacing="0.3">
      <text x="73.6" y="416.7">人根本无须害怕任何人。</text>
      <text x="73.6" y="450.72">如果一个人害怕某人，就</text>
      <text x="73.6" y="484.74">会将此人的权力置于自身</text>
      <text x="73.6" y="518.76">之上。</text>
    </g>
    <g font-family="FZLanTingXiHei, PingFang SC, sans-serif" font-size="11" fill="#7d838d">
      <text x="73.6" y="651.51">德米安</text>
      <text x="73.6" y="668.26">黑塞</text>
      <text x="73.6" y="685.01">2026/10/01</text>
    </g>
  </g>

  <!-- ── 架子前半 ───────────────────────────────────────────── -->
  <g id="rack-front">
  <!-- front：两条腿 + 外弯的脚 + 底部横杆 -->
  <g fill="none" stroke="#15171c" stroke-width="12" stroke-linecap="round">
    <path d="M 40.3 395.7 L 40.3 671.7 C 40.3 701.7 31.3 720.7 14.3 730.7"/>
    <path d="M 359.7 395.7 L 359.7 671.7 C 359.7 701.7 368.7 720.7 385.7 730.7"/>
    <path d="M 14.3 730.7 L 385.7 730.7"/>
  </g>

  <!-- front：中线上的两个卡夹 -->
  <g>
    <rect x="163" y="355" width="14" height="33.4" rx="5" fill="#15171c"/>
    <rect x="166" y="359.7" width="8.4" height="4.2" rx="2" fill="#ffffff" opacity="0.12"/>
  </g>
  <g>
    <rect x="223" y="355" width="14" height="33.4" rx="5" fill="#15171c"/>
    <rect x="226" y="359.7" width="8.4" height="4.2" rx="2" fill="#ffffff" opacity="0.12"/>
  </g>
  </g>
</svg>

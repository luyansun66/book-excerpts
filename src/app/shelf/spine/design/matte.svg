<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 145" width="27" height="145" role="img" aria-label="挪威的森林">
  <title>挪威的森林</title>
  <defs>
    <linearGradient id="s5-round" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".46"/>
      <stop offset=".07" stop-color="#000" stop-opacity=".14"/>
      <stop offset=".16" stop-color="#fff" stop-opacity=".06"/>
      <stop offset=".31" stop-color="#fff" stop-opacity="0.31"/>
      <stop offset=".52" stop-color="#fff" stop-opacity=".03"/>
      <stop offset=".80" stop-color="#000" stop-opacity=".08"/>
      <stop offset=".93" stop-color="#000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="s5-cap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".34"/>
      <stop offset=".035" stop-color="#000" stop-opacity=".02"/>
      <stop offset=".93" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".46"/>
    </linearGradient>

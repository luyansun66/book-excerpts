      <stop offset=".62" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s5-grain" x="0" y="0" width="100%" height="100%">

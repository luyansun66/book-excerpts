<!-- 折角书摘 · 引言卡模板（时光信箱）
     静态文字与图形固定；七处占位标记由 src/app/mailbox/svgGenerator.ts 填充：
       BIG_NUMBER   大编号（Georgia Bold，位数越多字号越小，垂直中心不变）
       TITLE_CN     第 N 封信
       LETTER_NO    Letter No. N
       DATE_CN      折角书摘·YYYY/MM/DD
       DATE_EN      Dogear · Month D, YYYY
       QUOTE_LINES  摘录正文（自动断行 + 字号自适应）
       ATTR_LINE    出处：70px 横线 +《书名》· 作者，单行右对齐至 x=960.2
     注意：占位标记只能在正文出现一次，替换逻辑不做全局匹配。-->
<svg id="_图层_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 1021.9 1527.7">
  <defs>
    <style>
/* 字体由 scripts/subset-letter-fonts.sh 子集化 + 转 woff2；源字体见 书签字体/ */
@font-face {
  font-family: "DFPSongW3-GB";
  font-style: normal;
  font-weight: 300;
  src: url("/fonts/华康宋体W3-P.woff2") format("woff2");
}
@font-face {
  font-family: "Georgia";
  font-style: normal;
  font-weight: 700;
  src: local("Georgia Bold"), local("Georgia-Bold"), url("/fonts/Georgia-Bold.woff2") format("woff2");
}
@font-face {
  font-family: "Georgia";
  font-style: italic;
  font-weight: 400;
  src: local("Georgia Italic"), local("Georgia-Italic"), url("/fonts/Georgia-Italic.woff2") format("woff2");
}
@font-face {
  font-family: "Trebuchet MS";
  font-style: normal;
  font-weight: 400;
  src: local("Trebuchet MS"), url("/fonts/TrebuchetMS.woff2") format("woff2");
}
.letter-rule-bold, .letter-rule-thin, .letter-rule-cream, .letter-attr-rule { fill: none; }
.letter-rule-bold { stroke: #6b4a2a; stroke-width: 2px; }
.letter-rule-thin { stroke: #6b4a2a; stroke-width: 1.4px; }
.letter-rule-cream { stroke: #ede0c4; stroke-width: 4px; }
.letter-attr-rule { stroke: #6b411b; stroke-width: 2px; }
.letter-kicker { fill: #6b4a2a; font-family: "Trebuchet MS", "Helvetica Neue", sans-serif; font-size: 32px; }
.letter-bignum { fill: #6b4a2a; font-family: Georgia, "Times New Roman", serif; font-size: 220px; font-weight: 700; }
.letter-cn-title { fill: #6b4a2a; font-family: "DFPSongW3-GB", "Songti SC", serif; font-size: 44px; font-weight: 300; }
.letter-letter-no { fill: #6b4a2a; font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-style: italic; }
.letter-cn-date { fill: #6b4a2a; font-family: "DFPSongW3-GB", "Songti SC", serif; font-size: 42px; font-weight: 300; }
.letter-en-date { fill: #6b4a2a; font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-style: italic; }
.letter-quote { fill: #351f0c; font-family: "DFPSongW3-GB", "Songti SC", serif; font-size: 48px; font-weight: 300; }
.letter-attr { fill: #6b411b; font-family: "DFPSongW3-GB", "Songti SC", serif; font-size: 35px; font-weight: 300; }
.letter-tint { fill: #f4e6d0; opacity: .6; }
.letter-cream-fill { fill: #ede0c4; }
.letter-brown-fill { fill: #6b4a2a; }
.letter-bg { clip-path: url(#clippath); }
    </style>
    <clipPath id="clippath">
      <rect width="1021.9" height="1527.7"/>
    </clipPath>
  </defs>
  <g class="letter-bg">
    <image width="1021.9" height="1527.7" preserveAspectRatio="xMidYMid slice" xlink:href="/assets/bg01.webp"/>
  </g>
  <rect class="letter-tint" width="1021.9" height="1527.7"/>
  <text class="letter-kicker" transform="translate(60.2 105)"><tspan x="0" y="0">READING</tspan></text>
  <text class="letter-kicker" transform="translate(310.2 105)"><tspan x="0" y="0">MEMORY</tspan></text>
  <text class="letter-kicker" transform="translate(610.2 105)"><tspan x="0" y="0">TIME</tspan></text>
  <text class="letter-kicker" transform="translate(845.2 105)"><tspan x="0" y="0">LETTER</tspan></text>
  <line class="letter-rule-bold" x1="60.2" y1="130" x2="960.2" y2="130"/>
  <line class="letter-rule-thin" x1="60.2" y1="403.9" x2="960.2" y2="403.9"/>
  <line class="letter-rule-thin" x1="60.2" y1="586.8" x2="960.2" y2="586.8"/>
  <line class="letter-rule-thin" x1="510.2" y1="130" x2="510.2" y2="586.8"/>
  {{BIG_NUMBER}}
  <text class="letter-cn-title" transform="translate(651.4 486)"><tspan x="0" y="0">{{TITLE_CN}}</tspan></text>
  <text class="letter-letter-no" transform="translate(661.5 533)"><tspan x="0" y="0">{{LETTER_NO}}</tspan></text>
  <text class="letter-cn-date" transform="translate(69.5 669.8)"><tspan x="0" y="0">{{DATE_CN}}</tspan></text>
  <text class="letter-en-date" transform="translate(69.8 712.8)"><tspan x="0" y="0">{{DATE_EN}}</tspan></text>
  <path class="letter-brown-fill" d="M899.2,651.4h35l15,15-15,15h-35v-30Z"/>
  <circle class="letter-cream-fill" cx="909.2" cy="666.4" r="4"/>
  <line class="letter-rule-thin" x1="60.2" y1="740.5" x2="960.2" y2="740.5"/>
  {{QUOTE_LINES}}
  {{ATTR_LINE}}
  <line class="letter-rule-bold" x1="60.2" y1="1413.1" x2="960.2" y2="1413.1"/>
  <text class="letter-cn-title" transform="translate(60.2 1468.1)"><tspan x="0" y="0">折角</tspan></text>
  <text class="letter-en-date" transform="translate(761.6 1463.1)"><tspan x="0" y="0">revisit, remember.</tspan></text>
  <path class="letter-brown-fill" d="M283.5,438.4l40,95c-26.7,26.7-53.3,26.7-80,0l40-95Z"/>
  <line class="letter-rule-cream" x1="283.5" y1="443.4" x2="283.5" y2="538.4"/>
  <path class="letter-brown-fill" d="M738,202.3l88.4,56.1v101h-176.8v-101l88.4-56.1Z"/>
  <circle class="letter-cream-fill" cx="738" cy="294.7" r="26"/>
</svg>

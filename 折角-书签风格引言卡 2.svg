  <text class="st20" transform="translate(220 867.5)"><tspan class="st22" x="0" y="0">雪崩时，没有一片雪花是无</tspan><tspan x="649.2" y="0">辜</tspan><tspan class="st26" x="0" y="64">的。在时代的洪流里，没有绝</tspan><tspan x="649.2" y="64">对</tspan><tspan class="st26" x="0" y="128">的旁观者，每一个个体的选择</tspan><tspan x="649.2" y="128">，</tspan><tspan x="0" y="192">都在共同塑造着世界的模样。</tspan></text>

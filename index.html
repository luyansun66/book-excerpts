<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="摘录" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>摘录 — 阅读摘录管理</title>
    <meta name="description" content="管理你的阅读摘录和个人感悟" />
    <meta name="theme-color" content="#F6F0E7" />
    <link rel="manifest" href="manifest-pwa.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <style>html, body { height: 100%; margin: 0; overflow: hidden; background: var(--color-bg); } body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; } #root { height: 100%; } /* 纸纹噪点 */ body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); border-radius: inherit; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register Service Worker for offline & PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(
            (reg) => console.log('SW registered:', reg.scope),
            (err) => console.warn('SW registration failed:', err),
          );
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
